<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balaji Library Attendance Register• Attendance Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020617;
  --card:#020617;
  --accent:#22d3ee;
  --accent2:#a855f7;
  --muted:#94a3b8;
  --radius:16px;
}
*{box-sizing:border-box;font-family:Inter}
body{
  margin:0;
  background:radial-gradient(circle at top,#020617,#000);
  color:#e5e7eb;
  padding:24px;
}
.container{max-width:1200px;margin:auto}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.brand{display:flex;gap:14px;align-items:center}
.logo{
  width:60px;height:60px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#020617;
}

/* CLOCK */
.clock{
  padding:12px 18px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 420px;gap:20px}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius);
  padding:18px;
}

/* STUDENTS */
.studentsList{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px
}
.studentItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  border-radius:14px;
  background:#020617;
  border:1px solid rgba(255,255,255,.06);
}
.avatar{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,#22d3ee,#a855f7);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#020617;
}
.btn{
  padding:8px 18px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:600;
  cursor:pointer;
}

/* FEED */
.feedItem{
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  margin-bottom:8px;
}

/* CALENDAR */
input[type="date"]{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  color:white;
  padding:8px;
  border-radius:10px;
  width:100%;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="brand">
    <div class="logo">BL</div>
    <div>
      <h2>Balaji Library Attendance</h2>
      <p>Premium Real-Time System</p>
    </div>
  </div>
  <div class="clock" id="clock">--</div>
</header>

<div class="grid">

<!-- LEFT -->
<div class="card">
  <h3>Students Seats (01-35)</h3>
  <div class="studentsList" id="studentsList"></div>
</div>

<!-- RIGHT -->
<div class="card">
  <h3>Select Date</h3>
  <input type="date" id="calendar">
  <h3 style="margin-top:16px">Attendance</h3>
  <div id="attendanceFeed"></div>
</div>

</div>

<footer style="text-align:center;margin-top:20px;color:#94a3b8">
  Built for ❤️ Balaji Library • Naukri Pulse
</footer>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJYQqaQSufqlH7-xz2ELLut-dJsC66PiY",
  authDomain: "libattendancesheet.firebaseapp.com",
  projectId: "libattendancesheet"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const students = Array.from({length:35},(_,i)=>({
  seat:`Seat No. ${String(i+1).padStart(2,'0')}`
}));

const studentsList = document.getElementById("studentsList");
const feed = document.getElementById("attendanceFeed");
const calendar = document.getElementById("calendar");

function today(){
  return calendar.value || new Date().toISOString().slice(0,10);
}

function renderStudents(){
  studentsList.innerHTML="";
  students.forEach(s=>{
    const div=document.createElement("div");
    div.className="studentItem";
    div.innerHTML=`
      <div style="display:flex;gap:12px;align-items:center">
        <div class="avatar">${s.seat.slice(-2)}</div>
        <strong>${s.seat}</strong>
      </div>
      <button class="btn">Mark</button>
    `;
    div.querySelector("button").onclick=async()=>{
      const ref=doc(db,"attendance",`${today()}_${s.seat}`);
      if(!(await getDoc(ref)).exists()){
        await setDoc(ref,{seat:s.seat,date:today()});
        alert("Attendance Marked");
      }else{
        alert("Already Marked");
      }
    };
    studentsList.appendChild(div);
  });
}

function loadFeed(){
  feed.innerHTML="";
  onSnapshot(collection(db,"attendance"),snap=>{
    const present=[];
    snap.forEach(d=>{
      if(d.data().date===today()) present.push(d.data().seat);
    });
    students.forEach(s=>{
      const div=document.createElement("div");
      div.className="feedItem";
      div.textContent=s.seat+(present.includes(s.seat)?" ✅ Present":" ❌ Absent");
      feed.appendChild(div);
    });
  });
}

calendar.onchange=loadFeed;

/* CLOCK */
setInterval(()=>{
  clock.textContent=new Date().toLocaleString();
},1000);

renderStudents();
loadFeed();
</script>

</body>
</html>
